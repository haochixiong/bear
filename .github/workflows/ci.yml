name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libxcb-xkb1 libfontconfig1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e ".[ai]"  # 让 Claude API 请求的测试也在 CI 里跑
      - name: Test
        run: python -m pytest -q

  build-windows:
    name: Build Windows exe
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10"
          pip install -e ".[ai,raw]"
          # 和 build_windows.bat 一样用显卡加速版（DirectML）；装不上时退回 CPU 版
          pip install "onnxruntime-directml>=1.17" || pip install "onnxruntime>=1.17"
      - name: Download AI skin model (verified)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging/models | Out-Null
          $m = "packaging/models/selfie_multiclass_256x256.onnx"
          Invoke-WebRequest -Uri "https://huggingface.co/FreeHugsForRobots/ps-skin-seg/resolve/main/selfie_multiclass_256x256.onnx" -OutFile $m
          if ((Get-FileHash -Algorithm SHA256 $m).Hash.ToLower() -ne "13961350bb2099688eb96182ffe26f24eb12c77b1df278a2ec95bbdc923136e1") { Remove-Item $m; throw "model hash mismatch" }
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/colordoctor.spec
      - name: Self test of packaged app
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\ColorDoctor\ColorDoctor.exe" -ArgumentList "--selftest" -Wait -PassThru
          $out = Get-Content selftest.log -Raw
          Write-Output $out
          if ($p.ExitCode -ne 0 -or $out -notmatch "SELFTEST OK") { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: ColorDoctor-windows
          path: dist/ColorDoctor

  build-macos:
    name: Build macOS app (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15  # Apple 芯片
            arch: arm64
          - runner: macos-15-intel  # Intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10"
          pip install -e ".[ai]"
          # RAW / AI 抠皮肤是可选功能：某个架构没有现成的安装包时照样打包，只是少这个功能
          pip install "rawpy>=0.19" || echo "::warning::rawpy 没有 ${{ matrix.arch }} 安装包，这个版本不支持相机 RAW"
          pip install "onnxruntime>=1.17" || echo "::warning::onnxruntime 没有 ${{ matrix.arch }} 安装包，这个版本没有 AI 抠皮肤"
      - name: Download AI skin model (verified)
        run: |
          mkdir -p packaging/models
          m=packaging/models/selfie_multiclass_256x256.onnx
          curl -fL -o "$m" https://huggingface.co/FreeHugsForRobots/ps-skin-seg/resolve/main/selfie_multiclass_256x256.onnx
          test "$(shasum -a 256 "$m" | cut -d' ' -f1)" = "13961350bb2099688eb96182ffe26f24eb12c77b1df278a2ec95bbdc923136e1" || { rm -f "$m"; echo "model hash mismatch"; exit 1; }
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/colordoctor.spec
      - name: Self test of packaged app
        run: |
          COLORDOCTOR_SELFTEST_LOG="$PWD/selftest.log" QT_QPA_PLATFORM=offscreen dist/ColorDoctor.app/Contents/MacOS/ColorDoctor --selftest || true
          cat selftest.log
          grep -q "SELFTEST OK" selftest.log
      - name: Zip app
        run: ditto -c -k --sequesterRsrc --keepParent dist/ColorDoctor.app dist/ColorDoctor-mac-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ColorDoctor-mac-${{ matrix.arch }}
          path: dist/ColorDoctor-mac-${{ matrix.arch }}.zip

  build-plugin:
    name: Photoshop plugin package (.ccx, Windows + Mac)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python packaging/build_plugin.py
      - uses: actions/upload-artifact@v4
        with:
          name: ColorDoctor-plugin
          path: dist/*.ccx
