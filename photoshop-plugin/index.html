<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <span class="brand">ColorDoctor</span>
    <span id="svc" class="chip ok">本机分析 · 不上传</span>
  </header>

  <section class="target">
    <div class="row">
      <select id="target" aria-label="分析对象">
        <option value="stack" title="从最底下到选中的图层为止叠起来看到的画面。选中的是调整图层、组、透明图层都可以；不会新建盖印图层">到这一层的画面</option>
        <option value="layer" title="只看选中图层自己的像素（例如抠出来的人像图层），透明的地方不算">只看这个图层</option>
        <option value="merged" title="所有可见图层合起来的整个画面；生成的调整图层放在最顶层">整个画面（合并可见）</option>
      </select>
      <button id="analyze" class="primary">分析到这一层</button>
    </div>
    <div class="row">
      <select id="precision" aria-label="分析精度">
        <option value="full" title="每个像素都检查。大图先出快速结果（约 1200 万像素），原图精查在后台进行，完成后自动替换">原图精度（大图先出快速结果）</option>
        <option value="fast" title="超过 2400 万像素的图由 PS 缩小后读取分析：读、传、算都快，一两个像素大的杂色点可能漏掉">快速（大图按约 2400 万像素）</option>
      </select>
    </div>
    <div id="targetName" class="strong">—</div>
    <div id="status" class="status">只在点击按钮时分析</div>
  </section>

  <nav class="cats">
    <button data-cat="color" class="cat on">色彩</button>
    <button data-cat="portrait" class="cat">人像</button>
    <button data-cat="reference" class="cat">仿色</button>
  </nav>
  <nav id="subs" class="subs"></nav>

  <section id="controls" class="controls"></section>

  <main id="results" class="results">
    <p class="hint">选好要分析的图层，点上面的分析按钮。</p>
  </main>

  <section id="acr" class="acr hidden">
    <div class="row between"><span class="strong">ACR 参数（可改）</span><span id="acrBadge" class="chip warn">估计</span></div>
    <div id="acrTable"></div>
    <div class="row">
      <button id="acrLayer">生成 Camera Raw 图层</button>
      <button id="acrExport">导出预设 .xmp</button>
    </div>
  </section>

  <footer class="bottom">
    <button id="generateAll" class="primary" disabled>一键生成全部</button>
    <div class="row">
      <button id="toggleAcr">ACR 参数</button>
      <button id="calibrate">校准 ACR 滑块…</button>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
